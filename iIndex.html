<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пошук стендів на виставковому плані</title>
  
  <!-- PDF.js та Panzoom -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>


  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1e1e24;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }


    /* Верхня панель управління */
    .toolbar {
      background: #2b2d42;
      padding: 12px 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 10;
    }


    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }


    .btn {
      background: #4cc9f0;
      color: #000;
      font-weight: bold;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #48bfe3; }


    input[type="file"] {
      font-size: 100px;
      position: absolute;
      left: 0; top: 0;
      opacity: 0;
      cursor: pointer;
    }


    .search-box {
      display: flex;
      gap: 8px;
      flex-grow: 1;
      max-width: 400px;
    }


    input[type="text"] {
      flex-grow: 1;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #4a4e69;
      background: #1e1e24;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #4cc9f0; }


    .status {
      font-size: 14px;
      color: #a0aab2;
    }


    /* Контейнер для перегляду карти */
    .viewport {
      flex-grow: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background: #121214;
    }
    .viewport:active { cursor: grabbing; }


    #panzoom-element {
      position: absolute;
      transform-origin: 0 0;
    }


    /* Текстовий шар та підсвічування */
    #page-container {
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }


    canvas { display: block; }


    .highlight-box {
      position: absolute;
      border: 3px solid #ff0055;
      background-color: rgba(255, 0, 85, 0.35);
      border-radius: 4px;
      pointer-events: none;
      box-shadow: 0 0 15px #ff0055;
      animation: pulse 1.2s infinite alternate;
      z-index: 5;
    }


    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 10px #ff0055; }
      100% { transform: scale(1.15); box-shadow: 0 0 25px #ff0055, 0 0 40px #ff0055; }
    }
  </style>
</head>
<body>


  <div class="toolbar">
    <div class="file-input-wrapper">
      <button class="btn">📁 Відкрити PDF</button>
      <input type="file" id="pdf-file" accept="application/pdf" />
    </div>


    <div class="search-box">
      <input type="text" id="search-input" placeholder="Номер стенда (наприклад, B5.312)" disabled />
      <button class="btn" id="search-btn" disabled>Знайти</button>
    </div>


    <span class="status" id="status-text">Завантажте PDF-файл планів</span>
  </div>


  <div class="viewport" id="viewport">
    <div id="panzoom-element">
      <div id="page-container">
        <canvas id="pdf-canvas"></canvas>
        <div id="highlight-layer"></div>
      </div>
    </div>
  </div>


  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';


    let pdfDoc = null;
    let pageTextContent = null;
    let panzoom = null;
    let currentViewport = null;


    const fileInput = document.getElementById('pdf-file');
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const statusText = document.getElementById('status-text');
    const container = document.getElementById('panzoom-element');
    const canvas = document.getElementById('pdf-canvas');
    const highlightLayer = document.getElementById('highlight-layer');
    const viewportElem = document.getElementById('viewport');


    // Ініціалізація Panzoom для масштабування та панорамації
    panzoom = Panzoom(container, {
      maxScale: 8,
      minScale: 0.5,
      contain: 'outside'
    });


    viewportElem.addEventListener('wheel', panzoom.zoomWithWheel);


    // Завантаження обраного PDF-файлу
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;


      statusText.innerText = "Завантаження PDF...";
      const fileReader = new FileReader();


      fileReader.onload = async function() {
        const typedarray = new Uint8Array(this.result);
        pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
        
        statusText.innerText = "Рендеринг високої якості...";
        await renderPage(1);


        searchInput.disabled = false;
        searchBtn.disabled = false;
        statusText.innerText = "Готово. Введіть номер стенда.";
      };


      fileReader.readAsArrayBuffer(file);
    });


    // Рендеринг сторінки
    async function renderPage(pageNum) {
      const page = await pdfDoc.getPage(pageNum);
      
      // Рендеримо у високому розділі (Scale 2.5), щоб векторні лінії та текст були чіткими
      const scale = 2.5;
      currentViewport = page.getViewport({ scale });


      canvas.height = currentViewport.height;
      canvas.width = currentViewport.width;


      const renderContext = {
        canvasContext: canvas.getContext('2d'),
        viewport: currentViewport
      };


      await page.render(renderContext).promise;
      pageTextContent = await page.getTextContent();
      
      // Скидання панорами
      panzoom.reset();
    }


    // Пошук та фокусування
    async function performSearch() {
      const query = searchInput.value.trim().toLowerCase();
      highlightLayer.innerHTML = ''; // Очистити попередні результати


      if (!query || !pageTextContent) return;


      let found = false;


      // Пошук у векторному текстовому шарі PDF
      for (const item of pageTextContent.items) {
        if (item.str.toLowerCase().includes(query)) {
          found = true;


          // Отримання координат тексту у PDF
          const tx = pdfjsLib.Util.transform(currentViewport.transform, item.transform);
          const x = tx[4];
          const y = tx[5] - Math.abs(tx[3]); // Коригування Y для Canvas
          const width = item.width * (currentViewport.width / pageTextContent.items[0].transform[0]); 
          const height = Math.abs(tx[3]) * 1.2;


          // Малюємо маркер
          const highlight = document.createElement('div');
          highlight.className = 'highlight-box';
          
          // Відступи навколо тексту
          const padding = 12;
          highlight.style.left = `${x - padding}px`;
          highlight.style.top = `${y - padding}px`;
          highlight.style.width = `${Math.max(width, 40) + (padding * 2)}px`;
          highlight.style.height = `${height + (padding * 2)}px`;


          highlightLayer.appendChild(highlight);


          // Автоматичне фокусування та наближення до об'єкта
          focusOnCoordinates(x, y);
          statusText.innerText = `Знайдено: "${item.str}"`;
          break; // Знайдено перше збігання
        }
      }


    if (!found) {
        statusText.innerText = `Стенд "${query}" не знайдено!`;
      }
    }


    // Центрування карти на вибраній точці
    function focusOnCoordinates(x, y) {
      const targetScale = 2.5; // Рівень зуму при фокусі
      const viewportWidth = viewportElem.clientWidth;
      const viewportHeight = viewportElem.clientHeight;


      // Обчислення зсуву для центрування точки (x, y)
      const panX = (viewportWidth / 2) - (x * targetScale);
      const panY = (viewportHeight / 2) - (y * targetScale);


      panzoom.zoom(targetScale, { animate: true });
      setTimeout(() => {
        panzoom.pan(panX, panY, { animate: true });
      }, 50);
    }


    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performSearch();
    });
  </script>
</body>
</html>
